[package]
name = "wrap_rocks"
version = "0.7.1"
edition = "2021"
# Oldest toolchain we build on; enforced by .cargo/config.toml.
rust-version = "1.91"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "wrap_rocks"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rust-rocksdb = { version = "0.52.0", features= ["zstd", "multi-threaded-cf"] }
